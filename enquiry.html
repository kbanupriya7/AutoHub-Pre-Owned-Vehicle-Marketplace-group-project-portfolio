<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Enquiry</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-slate-100">
    <header class="bg-blue-900 text-white p-5">
        <h1 class="text-2xl font-bold">Auto Hub</h1>
        <p class="text-sm">Find Your Best Vehicle</p>
    </header>

    <main class="bg-white p-8 rounded-xl shadow-lg max-w-2xl mx-auto mt-10">

        <form id="enquiryForm" class="space-y-3" novalidate>

            <h2 class="text-3xl font-bold text-slate-800 mb-5">Vehicle Enquiry Form</h2>

            <!-- CustomerName -->
            <div class="mb-4">
                <label for="name" class="text-slate-800 mb-1 font-semibold text-sm block">Customer Name</label>
                <input type="text" id="name" name="name" placeholder="Enter Your Full Name"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2.5" required>
            </div>

            <!-- Phone Number -->

            <div class="mb-4">
                <label for="phone" class="text-slate-800 mb-1 font-semibold text-sm block">Phone Number</label>
                <input type="tel" name="phone" placeholder="eg:-9874563210" id="phone" maxlength="10"
                    inputmode="numeric" pattern="[0-9]{10}" class="w-full border border-gray-300 rounded-lg px-3 py-2.5"
                    required>
            </div>

            <!-- Email Address -->
            <div class="mb-4">
                <label for="email" class="text-slate-800 mb-1 font-semibold text-sm block">Email Address</label>
                <input type="email" placeholder="you@mail.com" id="email" name="email"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2.5" required>
            </div>

            <!-- Selected Vehicle -->
            <div class="mb-4">
                <label for="vehicle" class="text-slate-800 mb-1 font-semibold text-sm block">Selected
                    Vehicle</label>
                <select name="Vehicle" id="vehicle"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2.5 bg-white" required>
                    <option value="">---Choose Vehicle---</option>
                    <option value="BMW M4">BMW M4</option>
                    <option value="Audi A6">Audi A6</option>
                    <option value="Toyota Fortuner">Toyota Fortuner </option>
                    <option value="Honda City">Honda City</option>
                    <option value="VW Virtus">VW Virtus</option>
                </select>

            </div>

            <!-- Message -->
            <div class="mb-4">
                <label for="message" class="text-slate-800 mb-1 font-semibold text-sm block">Message</label>
                <textarea name="Message" id="message" rows="3"
                    placeholder="Enter Your Message Or Queries About the Vehicle"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2.5" required></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-900  transition duration-200 cursor-pointer">
                Submit Enquiry
            </button>

            <!-- Succcess Message -->
            <div id="successMessage"
                class="hidden bg-emerald-50 border border-emerald-300 text-emerald-900 p-4 rounded-lg">
                Thank you! Your enquiry has been submitted successfully.
            </div>

        </form>
    </main>



    <script src="./enquiry.js"></script>


</body>

</html>
